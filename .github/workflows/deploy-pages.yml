name: Deploy Pirate Reborn Guidebook

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # The web packaging scripts are PowerShell scripts, so use a Windows runner.
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build web app
        run: npm run copy:web
      - name: Package verified Android live update
        shell: pwsh
        run: |
          $zipPath = Join-Path $env:RUNNER_TEMP 'guidebook-update.zip'
          Compress-Archive -Path 'www\*' -DestinationPath $zipPath -CompressionLevel Optimal
          $hash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          Copy-Item -LiteralPath $zipPath -Destination 'www\mobile-update.zip' -Force
          $manifest = [ordered]@{
            version = $env:GITHUB_SHA
            sha256 = $hash
            bundleUrl = 'https://gentlemenx.github.io/Pirate-Reborn-Guidebook/mobile-update.zip'
          } | ConvertTo-Json -Compress
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) 'www\mobile-update.json'), $manifest, [System.Text.UTF8Encoding]::new($false))
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Partial workflow reruns keep earlier artifacts for the same run.
          # Use a unique name per attempt so deploy-pages sees exactly one.
          name: github-pages-${{ github.run_attempt }}
          path: www
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
